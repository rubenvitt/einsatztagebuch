[package]
name = "ea-reader-wasm"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false

[lib]
# `cdylib` fuer das wasm-Modul, das `wasm-bindgen` weiterverarbeitet, `rlib`
# fuer den Wirtsbau: ohne `rlib` uebersetzte `cargo test --workspace
# --all-targets --locked` das Ziel `tests/bridge_boundary.rs` nicht mehr, weil
# ein reines `cdylib` von keinem Rust-Ziel verlinkt werden kann.
#
# KEIN Binaerziel, und das ist die Voraussetzung fuer die Positivliste:
# `cargo check --target wasm32-unknown-unknown -p ...` prueft Binaerziele mit,
# und genau daran scheitert `ea-ui-contracts` mit seinem `src/bin/emit-ts.rs`.
crate-type = ["cdylib", "rlib"]

[dependencies]
# JEDE Kante steht in `[dependencies]` und NICHT in einer
# `[target.'cfg(...)'.dependencies]`-Tabelle: der Manifestdurchlauf in
# `tools/xtask/tests/workspace.rs` iteriert nur ueber `dependencies`,
# `dev-dependencies` und `build-dependencies`, eine target-Tabelle bliebe fuer
# die Pin- und die `workspace = true`-Pflicht unsichtbar. Dass `js-sys` und
# `web-sys` damit auch auf einem Wirtsziel im Graphen liegen, kostet nichts:
# `src/opfs_worker.rs` ist dort weggetort und zieht keinen ihrer Typen.
ea-crypto.workspace = true
# `ea-reader` ist mit dieser Aufgabe aus `[dev-dependencies]` hierher
# gewandert: `src/opfs_worker.rs` implementiert den Port
# `ea_reader::ReaderBlobStore` und ist keine Testquelle mehr.
ea-reader.workspace = true
getrandom.workspace = true
hex.workspace = true
js-sys.workspace = true
sha2.workspace = true
wasm-bindgen.workspace = true
# Die Kante ist keine Bequemlichkeit, sondern GEMESSEN erzwungen: `blobPut` und
# `blobGet` sind asynchron, weil `OpfsBlobStore::open` den asynchronen Vorlauf
# der OPFS-Handles braucht, und das Makro `#[wasm_bindgen]` uebersetzt eine
# `async fn` in Code, der `wasm_bindgen_futures::future_to_promise` ruft. Ohne
# diese Zeile bricht `cargo check --target wasm32-unknown-unknown -p
# ea-reader-wasm` mit `E0433: cannot find module or crate
# wasm_bindgen_futures` an genau diesen zwei Ausfuhren ab. Die Crate gehoert
# zur in ADR 0005 ratifizierten Browser-Laufzeitklasse und liegt ueber den
# Tauri-Teilbaum ohnehin im Lockfile.
wasm-bindgen-futures.workspace = true
web-sys.workspace = true
# Die PRF-Ausgabe kommt als BESITZENDER `Vec<u8>` ueber die Grenze, damit
# `src/vault_bridge.rs` ihre Kopie im linearen Speicher unmittelbar nach der
# Ableitung loeschen kann. `SecretBytes` steht zwar unter `ZeroizeOnDrop`, aber
# fuer den Puffer, aus dem es gebaut wurde, kann es nichts tun — dafuer braucht
# es `Zeroize` an genau dieser Stelle.
zeroize.workspace = true

[dev-dependencies]
# Der Indexblob, den `tests/index_browser.rs` versiegelt, in OPFS schreibt und
# wieder oeffnet. DEV und keine Bibliothekskante: ein Re-Export durch
# `ea-reader` machte aus einer Testkante eine BIBLIOTHEKSflaeche, die jeder
# Wirt der Bruecke mittraegt, und stellte neben `crates/ea-index` eine zweite
# Nennung derselben Typen. Die wasm32-Zeile des Gates faehrt ohne
# `--all-targets` und zieht die Kante nie in den Lib-Graphen.
ea-index.workspace = true
# `SCHEMA_VERSION_V1` fuer die Beschriftungsspalten der drei Kulissenzeilen von
# `tests/index_browser.rs`. `ea-reader` re-exportiert die Konstante nicht, und
# ein Literal `1` daneben waere der zweite Satz Zahlen fuer dieselbe Tatsache.
ea-schema.workspace = true
# Die sieben Kanten der per `#[path]` eingebundenen Fixturekette, die
# `tests/verify_browser.rs` mitbringt. Sie stehen NICHT deshalb hier, weil die
# Bruecke sie benennt — ihre eigene Flaeche kennt keinen dieser Typen —,
# sondern weil `crates/ea-verify/tests/support/mod.rs` und die drei Module, die
# es seinerseits einbindet, sie im Quelltext nennen. `hex` und `ea-crypto`
# fehlen in dieser Aufzaehlung mit Absicht: beide stehen bereits in
# `[dependencies]` und sind einem Testziel damit ohnehin sichtbar.
#
# `ArchiveFixture` implementiert `ArchiveSource` selbst; der Bestand des
# Browserzeugen kommt also aus derselben Registrierungslinie wie der des
# Wirtszeugen und nicht aus einem zweiten, hier gebastelten.
ea-archive.workspace = true
# `encode_entry_package`, `encode_trust` und die Manifest-Kernfelder der
# Fixturekette.
ea-format.workspace = true
# `TrustedTimeState` in der Trust- und der Archivkulisse.
ea-time.workspace = true
# `decode_trust_anchor` und `TrustObjectSource` — der Anker, den der Tresor des
# Zeugen pinnt, kommt aus der Linie und nie aus dem Bestand.
ea-trust.workspace = true
# Hash-, Sequenz- und Statusbegriffe der Fixturekette.
ea-types.workspace = true
# `SigningKey`: die Fixturelinie signiert echt, damit ein gruenes Gate im
# Browser dieselbe Rechnung bezeugt wie auf dem Wirt.
ed25519-dalek.workspace = true
# Der handgeschriebene CBOR-Weg der Trust- und Formatkulisse.
minicbor.workspace = true
# Nur fuer `tests/bridge_boundary.rs`. Dev-Kanten sind hier unbedenklich: die
# wasm32-Zeile des Gates faehrt ohne `--all-targets` und zieht sie nie in den
# Graphen.
ea-verify.workspace = true
# Der JSON-Parser der Bruecken-DTO-Zeugen. Er steht hier, weil „das DTO ist
# gueltiges JSON" nur ein echter Parser belegen kann: die Fassung davor baute
# die Kopfzeilenliste mit `format!`, erzeugte an jedem `signature-input`
# unparsbares JSON, und keine handgeschriebene Zusicherung haette das gesehen.
# ENTWICKLUNGSabhaengigkeit — die wasm32-Zeile des Gates faehrt ohne
# `--all-targets` und zieht sie nie in den Lib-Graphen.
serde_json.workspace = true
# Der Laeufer von `tests/opfs_browser.rs`. Er steht als
# ENTWICKLUNGSabhaengigkeit exakt in `[workspace.dependencies]` der Wurzel und
# ist in ADR 0005 ratifiziert; `workspace_declares_exact_planned_members_and_
# shared_dependencies` durchlaeuft `dev-dependencies` mit derselben Strenge wie
# `dependencies`.
wasm-bindgen-test.workspace = true
