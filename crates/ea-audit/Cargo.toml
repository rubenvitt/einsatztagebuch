[package]
name = "ea-audit"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[dependencies]
# `object_hash` ueber die exakten Ereignisbytes und der Inhaltstyp der
# Signatur.
ea-crypto.workspace = true
# `encode_local_audit_core`, `encode_local_audit_event` und die zwoelf
# eingefrorenen Aktionen. Diese Crate deklariert KEINE zweite Aktions- oder
# Kontextaufzaehlung.
ea-format.workspace = true
# Die Signatur laeuft ueber den nativen Port; ein Signaturschluessel erscheint
# in dieser Crate nicht.
ea-key-provider.workspace = true
# Die verschluesselte Datenbank mit der anhaengenden Auditzeile.
ea-local-store.workspace = true
# `OperatorSessionProof` — der geprueften Sitzung entnimmt der Dienst
# Organisation, Geraet und Bedienerbindung.
ea-operator.workspace = true
ea-types.workspace = true
# Frische `event-id` und frische 32-Byte-Nonce je Ereignis. `ea-crypto` haelt
# seine Zufallsquelle privat, also gibt es keinen Accessor, den diese Crate
# stattdessen rufen koennte.
getrandom.workspace = true

[dev-dependencies]
# Die Grammatik von `schemas/reports/v1/local-audit.cddl` gegen die erzeugten
# Bytes.
cddl-cat.workspace = true
ea-key-provider = { workspace = true, features = ["test-support"] }
# Die Fixture baut eine ECHTE Registry-Linie und waehlt einen ECHTEN Head, um
# daraus einen echten Praesenznachweis auszustellen; sie bindet
# `crates/ea-trust/tests/support/mod.rs` per `#[path]` ein, wie
# `crates/ea-operator/tests/session_contract.rs` es bereits tut. Diese vier
# Eintraege sind genau die Importe jenes Moduls, die nicht schon oben stehen.
ea-testkit.workspace = true
ea-time.workspace = true
ea-trust.workspace = true
ed25519-dalek.workspace = true
minicbor.workspace = true
