[package]
name = "ea-draft"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[dependencies]
# `aead_seal`/`aead_open` unter dem `draftDEK`, plus die Geheimnistraeger.
ea-crypto.workspace = true
# Ein- und Auspacken des `draftDEK`; der Schluessel selbst liegt im
# Schluesselspeicher des Betriebssystems.
ea-key-provider.workspace = true
# Die verschluesselte Datenbank, ihr Schema und ihre Migrationskette. Diese
# Crate spricht kein SQL-Dialekt-API und traegt deshalb keine `rusqlite`-Kante.
ea-local-store.workspace = true
# `OperatorSessionProof` und `ReauthPurpose`. Verwerfen ist unwiderruflich und
# verlangt deshalb eine frische Wiederanmeldung fuer GENAU
# `ReauthPurpose::DiscardDraft` (`design.md`:256, :432).
ea-operator.workspace = true
# `PreexistingEffectiveNow`. `OperatorSessionProof::is_valid_for` nimmt
# ausschliesslich die Zeit eines gewaehlten Registry-Head; eine freie Zeit ist
# in Stufe 1 nicht baubar, und `ea-operator` re-exportiert den Typ nicht. Ohne
# diese Kante gaebe es keine Frischepruefung, sondern nur eine injizierbare
# Attrappe davon.
ea-trust.workspace = true
# `Id16`, `OrganizationId`, `ObjectHash` — kein neuer Bezeichnertyp.
ea-types.workspace = true
# Frischer `draftDEK`, frische AEAD-Nonce und frische Entwurfskennung aus dem
# CSPRNG des Betriebssystems.
getrandom.workspace = true
# NFC-Normalisierung der Einsatznummer VOR dem Registerschluessel, damit kein
# Aufrufer den Schluessel mit einer zerlegten Form aufweichen kann.
unicode-normalization.workspace = true

[features]
# Die Naht der Fehlerinjektion — `DiscardService::begin_discard_interrupted_at`
# — und NICHTS sonst. Sie bricht die unwiderrufliche Reihenfolge an einem
# beliebigen Punkt ab und hinterlaesst einen dauerhaften Halbzustand; ohne
# dieses Merkmal existiert dieser zweite Eingang in die Sequenz nicht. Die
# Testziele dieser Crate erreichen ihn ueber die Selbstkante unten, nicht ueber
# ein `--all-features` auf der Kommandozeile.
test-support = []

[dev-dependencies]
# Die SELBSTKANTE, die `test-support` fuer die Integrationstests einschaltet.
# Ein Merkmal erreicht ein Integrationstestziel ueber die
# Abhaengigkeitskante — genau so, wie `ea-key-provider` unten seines
# einschaltet — und nicht ueber die Kommandozeile des Laufs. Zyklische
# Entwicklungsabhaengigkeiten sind ausdruecklich erlaubt.
#
# Sie steht als `workspace = true` und NICHT als `path = "."`: die
# Wurzeltabelle fuehrt `ea-draft = { path = "crates/ea-draft" }` schon, und
# `tools/xtask/tests/workspace.rs`:86-101 verlangt fuer JEDE Kante jedes
# Mitglieds — auch fuer eine Entwicklungskante — die geteilte Fassung. Eine
# Pfadkante hier waere eine zweite, danebenlaufende Quelle derselben Wahrheit
# und bricht jene Zusicherung.
ea-draft = { workspace = true, features = ["test-support"] }
# `KeyProtectionProfileV1::OsWrapped` fuer den Datenbankschluessel der Fixture.
# AUSDRUECKLICH nur hier: die Crate selbst kodiert nichts und traegt deshalb
# keine Wire-Format-Kante.
ea-format.workspace = true
ea-key-provider = { workspace = true, features = ["test-support"] }
# `contains_canary` — der Nachweis, dass der Entwurfstext nicht im Klartext in
# der Datenbankdatei liegt.
ea-testkit.workspace = true
# Die Fixture baut eine ECHTE Registry-Linie und waehlt einen ECHTEN Head, um
# daraus einen echten Praesenznachweis auszustellen; sie bindet
# `crates/ea-trust/tests/support/mod.rs` per `#[path]` ein, wie
# `crates/ea-audit/tests/redaction.rs` es bereits tut. Diese drei Eintraege sind
# genau dessen Importe, die nicht schon oben stehen.
ea-time.workspace = true
ed25519-dalek.workspace = true
minicbor.workspace = true
