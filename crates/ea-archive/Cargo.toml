[package]
name = "ea-archive"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false

[dependencies]
# Fuer ea_crypto::object_hash: der Objekthash ist auch fuer NICHT parsbare
# Bytes berechenbar, und genau darauf stuetzt sich der Quarantaeneeintrag mit
# Grund `malformed`. Intra-Workspace-Crate, bereits auf der wasm32-Positivliste.
ea-crypto.workspace = true
ea-format.workspace = true
ea-trust.workspace = true
ea-types.workspace = true

[dev-dependencies]
ea-time.workspace = true
ed25519-dalek.workspace = true
# Nur fuer das per #[path] eingebundene Fixture-Modul von ea-format, das
# Testvektoren aus Hex liest. Dev-Dependency, also nie im wasm32-Lib-Graphen.
hex.workspace = true
minicbor.workspace = true
