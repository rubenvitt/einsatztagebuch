[package]
name = "ea-archive-fs"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false

[dependencies]
ea-archive.workspace = true
# Die Migration schreibt eine SIGNIERTE lokale Auditzeile, bevor sie
# zurueckkehrt (`design.md` §11.5). `LocalAuditService::record_signed` ist der
# einzige Weg dorthin; ohne diese Kante liesse sich die Zusage nicht ausdruecken.
ea-audit.workspace = true
ea-crypto.workspace = true
ea-format.workspace = true
# Der Profilwechsel verlangt einen FRISCHEN Bedienernachweis mit genau dem
# Zweck `ReauthPurpose::ArchiveProfileMigration`. Der Nachweistyp lebt hier.
ea-operator.workspace = true
ea-trust.workspace = true
ea-types.workspace = true
# Das neue Archiv wird VOLLSTAENDIG OFFLINE verifiziert, bevor der Zeiger
# umschaltet. Die Richtung ist erzwungen: `crates/ea-verify/Cargo.toml`
# haengt schon an `ea-archive`, eine Kante von `ea-archive` auf `ea-verify`
# waere ein Cargo-Zyklus. Deshalb liegt jede Wirtimplementierung hier.
ea-verify.workspace = true

[features]
# Die Beobachtungsflaeche von `LocalPathBackend`, die Task 10 und Task 12
# benutzen: `exists_for_test`, `read_for_test`, `overwrite_for_test` und die
# uebrigen.
#
# Sie steht hinter einem Feature, damit ein Release der Stufe 7 sie mit
# `--no-default-features` weglassen kann. Es ist trotzdem ein DEFAULT-Feature,
# und zwar aus einem Cargo-Grund und nicht aus Bequemlichkeit: ein
# Integrationstest kann das Feature SEINER EIGENEN Crate nicht einschalten, und
# der uebliche Ausweg — eine Selbst-Dev-Dependency — schriebe `Cargo.lock` um.
# Der Gate-Lauf `cargo test --workspace --all-targets --locked` laeuft OHNE
# `--all-features`; ohne diesen Default uebersetzten die fuenf
# Integrationstests dort nicht.
#
# RELEASEAUSSCHLUSS, namentlich: die drei MUTIERENDEN Methoden
# `overwrite_for_test`, `materialize_for_test` und `remove_for_test` liegen
# hinter genau diesem Feature. `overwrite_for_test` umgeht Create-if-absent und
# `remove_for_test` loescht Archivbytes; ein Releasebau der Stufe 7 baut diese
# Crate deshalb mit `--no-default-features` und traegt keine der drei in seiner
# oeffentlichen API. `tools/xtask/tests/workspace.rs` pinnt diesen Absatz
# zusammen mit der Lage der drei Methoden hinter dem cfg.
#
# Dieser Absatz allein GENUEGTE NICHT, und deshalb steht der Schalter jetzt in
# der geteilten Kante: `--no-default-features` wirkt auf das AUSGEWAEHLTE Paket
# und nicht auf Default-Features seiner Abhaengigkeiten, also erbte jeder Wirt
# (`apps/desktop/src-tauri`, `crates/ea-writer`, `crates/ea-ui-contracts`) die
# drei Methoden in seiner oeffentlichen Flaeche. `workspace.dependencies` in
# `Cargo.toml` setzt darum `default-features = false`; wer die
# Beobachtungsflaeche braucht, fordert `features = ["test-support"]` an einer
# DEV-Kante an. Der Zeuge
# `no_non_test_edge_carries_the_ea_archive_fs_test_surface` liest dafuer den
# AUFGELOESTEN Merkmalsbaum des Wirts und nicht diesen Text.
default = ["test-support"]
test-support = []

[dev-dependencies]
# Nur fuer die Auditattrappe der Migrationstests: `SignedLocalAuditService`
# verlangt einen `KeyProvider`, und `InMemoryKeyProvider` ist der einzige, der
# ohne Betriebssystemschluesselspeicher auskommt.
ea-key-provider = { workspace = true, features = ["test-support"] }
# Fuer die per #[path] eingebundenen Fixture-Module von ea-verify, ea-archive,
# ea-trust und ea-format. Dev-Dependencies, also nie im wasm32-Lib-Graphen.
ea-time.workspace = true
ed25519-dalek.workspace = true
hex.workspace = true
minicbor.workspace = true
