[package]
name = "ea-ui-contracts"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false

[dependencies]
# `QuarantineReason` — der Grund, aus dem ein Objekt isoliert wurde. Er wird
# RE-EXPORTIERT und nie neu erklaert: eine zweite Gruendemenge waere genau die
# Abweichung, die die Driftschranke dieser Crate verhindern soll.
ea-archive.workspace = true
# `SyncStatus` und `DetailCause`. Die vier Sync-Beschriftungen sind woertliche
# Oberflaechenkopie aus den globalen Randbedingungen, und die Detailursache
# steht DANEBEN und ist nie ein fuenfter Zustand. Beide kommen von hier und
# werden hier nur weitergegeben.
# OHNE Default-Features (der Schalter steht in `workspace.dependencies`):
# `test-support` ist bei `ea-archive-fs` ein Default-Feature, und seine drei
# MUTIERENDEN Methoden wanderten sonst ueber diese Kante in die Flaeche des
# Wirts. Diese Crate braucht von dort nur `SyncStatus` und `DetailCause`.
ea-archive-fs.workspace = true
# `SignerRole`. Eine Rolle, die ueber die Guelltigkeit einer Signatur
# mitentscheidet, gehoert nicht in eine handgeschriebene TypeScript-Liste.
ea-crypto.workspace = true
# `LocalAuditOutcomeV1`, `KeyProtectionProfileV1` und `OperatorRoleV1` — die
# drei Sicherheitsaufzaehlungen, die dort definiert bleiben, wo sie entstanden
# sind.
ea-format.workspace = true
# Die GESCHLOSSENEN Stufe-1-Vereinigungen der Momentaufnahmen und des
# Vorgangs. `IncidentUniquenessKey` ist die Identitaet EINES Vorgangs, und die
# Bestaetigungsansicht muss benennen, welchen Vorgang sie abschliesst.
ea-schema.workspace = true
# `BundleRejectionCodeV1` — der Grund, aus dem eine Kandidatenfassung des
# Web-Bundles NICHT aktiviert wurde. Er wird RE-EXPORTIERT und nie neu
# erklaert; eine zweite Gruendemenge waere genau die Drift, gegen die diese
# Crate steht. Die Kante ist einseitig wie die zu `ea-verify`: `ea-reader`
# steht auf der wasm32-Positivliste, diese Crate in `WASM32_EXEMPT_CRATES`,
# und kein Weg laeuft zurueck. OHNE Default-Features, damit das Merkmal
# `test-support` von `ea-reader` AUS bleibt.
ea-reader.workspace = true
# `Id16`, `ChainSequence`, `UnixMillis`, `OrganizationId` — kein neuer
# Bezeichnertyp.
ea-types.workspace = true
# `ServerConfirmationV1` — die EIGENE Dimension neben dem Verifikationsergebnis
# (`design.md` §17.4). Sie wird RE-EXPORTIERT und nie neu erklaert; eine
# zweite Bestaetigungsmenge waere genau die Vermischung, die §17.4 verbietet.
# Die Kante ist einseitig: `ea-verify` steht auf der wasm32-Positivliste,
# diese Crate in `WASM32_EXEMPT_CRATES`, und kein Weg laeuft zurueck.
ea-verify.workspace = true
# `FinalizationPreview`, `FinalizeOutcome`, `FinalizationPhase` und
# `RecoveryOutcome`. Die Ansichtsmodelle entstehen AUS diesen Werten; ohne
# diese Kante waeren sie eine daneben laufende zweite Beschreibung derselben
# Finalisierung.
ea-writer.workspace = true
