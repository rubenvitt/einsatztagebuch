[package]
name = "ea-recovery"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false

[features]
# Explicit Stage-5 real-module gate; never a production provider override.
pkcs11-fixture = []

[[test]]
name = "pkcs11_provider"
required-features = ["pkcs11-fixture"]

[[example]]
name = "pkcs11_fixture"
required-features = ["pkcs11-fixture"]

[dependencies]
serde.workspace = true
serde_json.workspace = true
hex.workspace = true
# Guided recovery validates native/offline providers and persists exact encrypted source snapshots.
ea-key-provider.workspace = true
ea-local-store.workspace = true
ea-schema.workspace = true
cryptoki.workspace = true
# Argon2id, die Passphrasen-KDF des verschluesselten Schluesselcontainers
# (`src/encrypted_container.rs`). Die AEAD dahinter ist weiterhin das
# ChaCha20-Poly1305 aus `ea-crypto`; diese Kante bringt KEINE zweite.
argon2.workspace = true
# Archivbestand und Layout: diese Crate legt die dateisystemgestuetzte
# ArchiveSource ueber ein Verzeichnis und braucht dafuer die Pfadregeln.
ea-archive.workspace = true
ea-audit.workspace = true
ea-operator.workspace = true
ea-time.workspace = true
# Deterministisches CBOR fuer den Schluesselcontainer: `validate` vor jedem
# Dekodieren, damit ein nicht kanonischer Container gar nicht erst geoeffnet
# wird — derselbe Weg wie `ea_trust::decode_trust_anchor`.
ea-cbor.workspace = true
# Entschluesselung: Empfaengerschluessel, Grants und CEK-Auspackung.
ea-crypto.workspace = true
ea-format.workspace = true
ea-trust.workspace = true
ea-types.workspace = true
# Die Verifikationspipeline. verify-before-use laeuft ausschliesslich hier
# hindurch; kein Kommandopfad ruft verify_archive direkt.
ea-verify.workspace = true
# Salz und Nonce des Schluesselcontainers. Dieselbe Kiste und derselbe Aufruf
# wie in `crates/ea-crypto/src/hpke.rs`; `ea-crypto` gibt keinen
# Zufallshelfer heraus, und ein zweiter Entropieweg waere eine zweite Wahrheit.
getrandom.workspace = true
# Der CBOR-Kodierer des Schluesselcontainers, wie in `ea-trust` und
# `ea-key-provider`.
minicbor.workspace = true
# Ueberschreibt die Stapelkopie des abgeleiteten Containerschluessels, sobald
# sie in `SecretBytes` gewandert ist.
zeroize.workspace = true

[dev-dependencies]
ea-key-provider = { workspace = true, features = ["test-support"] }
ea-local-store.workspace = true
# Nur fuer die per #[path] eingebundene Fixture-Kette von ea-verify, ea-archive,
# ea-trust und ea-format. Dev-Dependencies, also nie im Lib-Graphen.
ea-time.workspace = true
ed25519-dalek.workspace = true
hex.workspace = true
# Die Fixture-Bauer der Reader-Key-Escrow-Familien für die Zeugen der zweiten
# getypten Operation (`tests/reader_key_escrow.rs`, DRK-458). Nur Dev-Kante:
# `ea-testkit` hängt nicht an `ea-recovery`, der Lib-Graph bleibt unberührt.
ea-testkit.workspace = true
