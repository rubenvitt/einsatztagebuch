[package]
name = "ea-trust"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false

[features]
# Explizite Fixture-Konstruktoren fuer Zeugen ANDERER Crates (Server, Writer,
# Pruefung), die einen wirksamen Writer-Uebergang gegen einen Eintrag halten
# wollen, ohne dafuer eine ganze Registry-Linie nachzuspielen. Produktive
# Eintrittspunkte konsultieren dieses Merkmal nie; ohne Merkmal gibt es
# ausserhalb der Crate keinen Konstruktor.
test-support = []

[dependencies]
ea-cbor.workspace = true
ea-crypto.workspace = true
ea-format.workspace = true
ea-time.workspace = true
ea-types.workspace = true
minicbor.workspace = true

[dev-dependencies]
ed25519-dalek.workspace = true
# Die Fixture-Bauer der Reader-Key-Escrow-Familien (`reader_key_escrow_fixture`):
# EINE Kodierung für Trust-Kern, native Zeremonie und Server. Die Kante zeigt
# in die zulässige Richtung — `ea-testkit` hängt nicht an `ea-trust`.
ea-testkit.workspace = true
