[workspace]
members = ["tools/xtask", "tests/ea-system-tests", "crates/ea-types", "crates/ea-cbor", "crates/ea-crypto", "crates/ea-format", "crates/ea-schema", "crates/ea-time", "crates/ea-trust", "crates/ea-archive", "crates/ea-archive-fs", "crates/ea-chain", "crates/ea-verify", "crates/ea-recovery", "crates/ea-testkit", "crates/ea-key-provider", "crates/ea-operator", "crates/ea-local-store", "crates/ea-audit", "crates/ea-draft", "crates/ea-writer", "crates/ea-ui-contracts", "crates/ea-sync-protocol", "crates/ea-sync-server", "crates/ea-sync-client", "apps/server", "apps/cli", "apps/desktop/src-tauri"]
resolver = "2"

[workspace.package]
edition = "2024"
rust-version = "1.95"
license = "Apache-2.0 OR MIT"

[workspace.dependencies]
async-trait = { version = "=0.1.92", default-features = false }
aws-sdk-s3 = { version = "=1.144.0", default-features = false, features = ["behavior-version-latest", "http-1x", "rt-tokio"] }
aws-smithy-http-client = { version = "=1.4.0", default-features = false, features = ["rustls-ring"] }
axum = { version = "=0.8.9", default-features = false, features = ["http1", "http2", "tokio"] }
cddl = { version = "=0.10.7", default-features = false, features = ["additional-controls", "ast-span", "cbor", "json"] }
cddl-cat = { version = "=0.7.1", default-features = false, features = ["ciborium"] }
chacha20poly1305 = { version = "=0.11.0", features = ["zeroize"] }
cms = { version = "=0.2.3", features = ["std"] }
coset = { version = "=0.4.2", features = ["std"] }
der = { version = "=0.7.10", features = ["alloc", "oid"] }
ed25519-dalek = { version = "=3.0.0", features = ["rand_core"] }
ea-archive = { path = "crates/ea-archive" }
# `default-features = false` an der GETEILTEN Kante, und zwar hier, weil Cargo
# es am einzelnen Mitglied nicht zulaesst: `default-features = false` neben
# `workspace = true` ist ein Fehler, solange die Workspace-Kante selbst nichts
# dazu sagt. Das Default-Feature `test-support` von `ea-archive-fs` traegt
# `overwrite_for_test` (umgeht Create-if-absent), `materialize_for_test` und
# `remove_for_test` (loescht Archivbytes); ohne diesen Schalter lagen alle drei
# in der oeffentlichen Flaeche jedes Wirts, der die Crate zieht — ein
# `--no-default-features` am AUSGEWAEHLTEN Paket wirkt nicht auf
# Default-Features seiner Abhaengigkeiten. Hier ist der Schalter ausserdem
# fail-closed: ein neues Mitglied erbt die Flaeche NICHT und muss sie an einer
# Dev-Kante ausdruecklich anfordern.
ea-archive-fs = { path = "crates/ea-archive-fs", default-features = false }
ea-audit = { path = "crates/ea-audit" }
ea-cbor = { path = "crates/ea-cbor" }
ea-chain = { path = "crates/ea-chain" }
ea-crypto = { path = "crates/ea-crypto" }
ea-draft = { path = "crates/ea-draft" }
ea-format = { path = "crates/ea-format" }
ea-key-provider = { path = "crates/ea-key-provider" }
ea-local-store = { path = "crates/ea-local-store" }
ea-operator = { path = "crates/ea-operator" }
ea-recovery = { path = "crates/ea-recovery" }
ea-schema = { path = "crates/ea-schema" }
ea-sync-client = { path = "crates/ea-sync-client" }
ea-sync-protocol = { path = "crates/ea-sync-protocol" }
ea-sync-server = { path = "crates/ea-sync-server" }
ea-testkit = { path = "crates/ea-testkit" }
ea-time = { path = "crates/ea-time" }
ea-trust = { path = "crates/ea-trust" }
ea-types = { path = "crates/ea-types" }
ea-ui-contracts = { path = "crates/ea-ui-contracts" }
ea-verify = { path = "crates/ea-verify" }
ea-writer = { path = "crates/ea-writer" }
hex = "=0.4.3"
# Die drei HTTP-Kanten des WRITER-KLIENTEN. Sie sind in ADR 0004 mit
# derselben Strenge geprueft wie die Serverklasse und ziehen KEINEN zweiten
# HTTP- oder TLS-Baum: `hyper` 1.x liegt ueber `axum` ohnehin im Graphen,
# und der Klient bindet sich mit `tokio-rustls`/`rustls` auf `ring` an
# genau denselben Stapel wie der Server.
http = { version = "=1.5.0", default-features = false, features = ["std"] }
http-body-util = { version = "=0.1.5", default-features = false }
hyper = { version = "=1.11.0", default-features = false, features = ["client", "http1"] }
hyper-util = { version = "=0.1.20", default-features = false, features = ["tokio"] }
getrandom = { version = "=0.4.3", features = ["wasm_js"] }
hpke = { version = "=0.14.0", default-features = false, features = ["alloc", "getrandom", "x25519", "chacha"] }
jiff = { version = "=0.2.35", default-features = false, features = ["std", "tzdb-bundle-always"] }
jiff-tzdb = "=0.1.8"
jsonschema = { version = "=0.49.9", default-features = false, features = ["arbitrary-precision"] }
libfuzzer-sys = "=0.4.13"
libsqlite3-sys = { version = "=0.38.0", default-features = false, features = ["bundled-sqlcipher-vendored-openssl"] }
minicbor = { version = "=2.3.0", features = ["derive", "std"] }
rusqlite = { version = "=0.40.0", default-features = false, features = ["bundled-sqlcipher-vendored-openssl"] }
rustls = { version = "=0.23.43", default-features = false, features = ["logging", "ring", "std"] }
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = { version = "=1.0.151", features = ["arbitrary_precision"] }
sha2 = { version = "=0.11.0", default-features = false, features = ["zeroize"] }
sqlx = { version = "=0.9.0", default-features = false, features = ["postgres", "runtime-tokio", "tls-rustls-ring-webpki"] }
# `migrate` steht an den beiden Teilcrates statt an der Fassade, und das ist
# keine Geschmacksfrage: die Fassadenmerkmale `macros` und `migrate` verweisen
# beide schwach auf `sqlx-sqlite?/...`, und eine schwache Merkmalsreferenz
# zwingt Cargo trotzdem, `sqlx-sqlite` zu VERSIONIEREN. Dessen
# `libsqlite3-sys >=0.30.1, <0.38.0` kollidiert dann mit dem `=0.38.0` aus
# `docs/adr/0002-local-database-encryption.md` ueber `links = "sqlite3"`, und
# der ganze Arbeitsbereich loest nicht mehr auf. Begruendet in
# `docs/adr/0004-server-runtime-and-dependency-class.md`.
sqlx-core = { version = "=0.9.0", default-features = false, features = ["migrate"] }
sqlx-postgres = { version = "=0.9.0", default-features = false, features = ["migrate"] }
tauri = { version = "=2.11.5" }
tauri-build = { version = "=2.6.3" }
tokio = { version = "=1.53.1", default-features = false, features = ["macros", "net", "rt-multi-thread", "signal", "sync", "time"] }
tokio-rustls = { version = "=0.26.4", default-features = false, features = ["logging", "ring"] }
toml = "=0.8.23"
unicode-normalization = "=0.1.25"
zeroize = { version = "=1.9.0", features = ["derive"] }
x25519-dalek = { version = "=3.0.0", default-features = false, features = ["static_secrets", "zeroize"] }
x509-tsp = "=0.1.0"
