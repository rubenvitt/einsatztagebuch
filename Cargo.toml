[workspace]
members = ["tools/xtask", "tests/ea-system-tests", "crates/ea-types", "crates/ea-cbor", "crates/ea-crypto", "crates/ea-format", "crates/ea-schema", "crates/ea-time", "crates/ea-trust", "crates/ea-archive", "crates/ea-chain", "crates/ea-verify", "crates/ea-recovery", "crates/ea-testkit", "apps/cli"]
resolver = "2"

[workspace.package]
edition = "2024"
rust-version = "1.95"
license = "Apache-2.0 OR MIT"

[workspace.dependencies]
cddl = { version = "=0.10.7", default-features = false, features = ["additional-controls", "ast-span", "cbor", "json"] }
cddl-cat = { version = "=0.7.1", default-features = false, features = ["ciborium"] }
chacha20poly1305 = { version = "=0.11.0", features = ["zeroize"] }
cms = { version = "=0.2.3", features = ["std"] }
coset = { version = "=0.4.2", features = ["std"] }
der = { version = "=0.7.10", features = ["alloc", "oid"] }
ed25519-dalek = { version = "=3.0.0", features = ["rand_core"] }
ea-archive = { path = "crates/ea-archive" }
ea-cbor = { path = "crates/ea-cbor" }
ea-chain = { path = "crates/ea-chain" }
ea-crypto = { path = "crates/ea-crypto" }
ea-format = { path = "crates/ea-format" }
ea-recovery = { path = "crates/ea-recovery" }
ea-schema = { path = "crates/ea-schema" }
ea-testkit = { path = "crates/ea-testkit" }
ea-time = { path = "crates/ea-time" }
ea-trust = { path = "crates/ea-trust" }
ea-types = { path = "crates/ea-types" }
ea-verify = { path = "crates/ea-verify" }
hex = "=0.4.3"
getrandom = { version = "=0.4.3", features = ["wasm_js"] }
hpke = { version = "=0.14.0", default-features = false, features = ["alloc", "getrandom", "x25519", "chacha"] }
jiff = { version = "=0.2.35", default-features = false, features = ["std", "tzdb-bundle-always"] }
jiff-tzdb = "=0.1.8"
jsonschema = { version = "=0.49.9", default-features = false, features = ["arbitrary-precision"] }
libfuzzer-sys = "=0.4.13"
minicbor = { version = "=2.3.0", features = ["derive", "std"] }
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = { version = "=1.0.151", features = ["arbitrary_precision"] }
sha2 = { version = "=0.11.0", default-features = false, features = ["zeroize"] }
toml = "=0.8.23"
unicode-normalization = "=0.1.25"
zeroize = { version = "=1.9.0", features = ["derive"] }
x25519-dalek = { version = "=3.0.0", default-features = false, features = ["static_secrets", "zeroize"] }
x509-tsp = "=0.1.0"
