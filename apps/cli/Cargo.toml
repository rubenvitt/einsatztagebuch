[package]
name = "einsatzarchiv-cli"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false

[[bin]]
name = "einsatzarchiv"
path = "src/main.rs"

[dependencies]
# Die Fachlogik des SECHSTEN Kommandos, und ausschliesslich sie:
# `BootstrapCoordinator` fuehrt den Zwoelfschrittablauf aus `§12.1`
# (`design.md`:1336-1349), `FileBootstrapStore` persistiert ihn, `AdminError`
# traegt die stabilen Codes, die `organization.rs` auf die Exitcodetabelle
# abbildet. Die Richtung ist dieselbe wie zu `ea-recovery` und ebenso
# einseitig: `ea-admin` kennt weder dieses Paket noch den Begriff eines
# Exitcodes — die normative Tabelle (`design.md`:1800-1815) ist eine Zusage des
# PROZESSES und wohnt deshalb hier. `apps/cli` bleibt damit bei
# Argumentgrammatik, Ausgabeform und process::exit; die Zeremonie selbst
# entsteht Zeile fuer Zeile in `crates/ea-admin`. Das Kommando stammt aus dem
# Umsetzungsplan der Stufe 5, Task 2 — die Spec-Grammatik
# (`design.md`:1787-1793) fuehrt es nicht.
ea-admin.workspace = true
# Die gesamte uebrige Fachlogik. Dieses Paket traegt nur Argumentgrammatik,
# Ausgabeform und process::exit.
ea-recovery.workspace = true
ea-types.workspace = true
ea-verify.workspace = true

[dev-dependencies]
# Nur fuer die per #[path] eingebundene Fixture-Kette von ea-verify, ea-archive,
# ea-trust und ea-format sowie fuer den Schemanachweis des Berichts.
ea-archive.workspace = true
ea-crypto.workspace = true
ea-format.workspace = true
ea-time.workspace = true
ea-trust.workspace = true
ea-types.workspace = true
ed25519-dalek.workspace = true
hex.workspace = true
jsonschema.workspace = true
minicbor.workspace = true
serde_json.workspace = true
