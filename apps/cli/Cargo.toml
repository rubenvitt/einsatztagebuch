[package]
name = "einsatzarchiv-cli"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false

[[bin]]
name = "einsatzarchiv"
path = "src/main.rs"

[dependencies]
# Die gesamte Fachlogik. Dieses Paket traegt nur Argumentgrammatik,
# Ausgabeform und process::exit.
ea-recovery.workspace = true
ea-types.workspace = true
