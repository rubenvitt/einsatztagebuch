[package]
name = "ea-system-tests"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false

[dependencies]

# Die JSON-Schema-Validierung des Verifikationsberichts findet AUSSCHLIESSLICH
# hier statt. `jsonschema` zieht `getrandom 0.3.4` in den Graphen, und
# `ea-verify` steht auf der wasm32-Positivliste — die beiden duerfen deshalb
# nie Dependency einer der Bibliotheks-Crates werden.
[dev-dependencies]
ea-archive.workspace = true
# Die Kanonizitaetseigenschaft der Eigenschaftstests nennt
# `ea_cbor::validate(..., ParserLimits::V1)` DIREKT. `ea-format` reicht nur
# `CborError` durch, nicht den Pruefer und nicht die Grenzen; ohne diese Zeile
# waere die Eigenschaft nur mittelbar ueber `decode_exact_object` behauptet und
# die Zahlen aus Global Constraint Zeile 30 blieben ungemessen. `ea-cbor` ist
# eine Pfad-Crate des Workspace und steht bereits in `Cargo.lock`.
ea-cbor.workspace = true
ea-chain.workspace = true
ea-crypto.workspace = true
ea-format.workspace = true
ea-schema.workspace = true
# Die eingefrorenen Vektoren und ihr Manifestmodell. `ea-testkit` haelt
# `jsonschema` von sich fern: die Schemavalidierung findet ausschliesslich in
# dieser Testcrate statt.
ea-testkit.workspace = true
ea-time.workspace = true
ea-trust.workspace = true
ea-types.workspace = true
ea-verify.workspace = true
ed25519-dalek.workspace = true
# Fuer das per `#[path]` eingebundene Archiv-Support-Modul, das Objekthashes
# hexadezimal in Pfadhinweise schreibt.
hex.workspace = true
jsonschema.workspace = true
minicbor.workspace = true
serde_json.workspace = true
toml.workspace = true

[build-dependencies]
