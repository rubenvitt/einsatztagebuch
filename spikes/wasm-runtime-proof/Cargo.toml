# Eigene Workspace-Wurzel. Die Wurzel /home/rubeen/dev/einsatztagebuch/Cargo.toml
# fuehrt eine explizite members-Liste ohne Globs und darf nicht angefasst werden;
# ohne diesen leeren Tisch bricht Cargo mit
# "current package believes it's in a workspace when it's not" ab.
[workspace]

[package]
name = "ea-wasm-runtime-proof"
version = "0.0.0"
edition = "2024"
rust-version = "1.95"
publish = false
license = "MIT OR Apache-2.0"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
# Pfadkante in das Repo. ea-crypto erbt seine "="-Pins weiterhin von SEINER
# eigenen Workspace-Wurzel (Cargo bestimmt die Wurzel je Paket neu), also bleiben
# hpke/ed25519-dalek/chacha20poly1305/getrandom exakt die gepinnten Versionen.
ea-crypto = { path = "../../crates/ea-crypto" }

# Direkt, damit der Spike getrandom selbst aufrufen kann. Version und Feature
# zeichengleich zu /home/rubeen/dev/einsatztagebuch/Cargo.toml:66.
getrandom = { version = "=0.4.3", features = ["wasm_js"] }

# Muss EXAKT der Version in /home/rubeen/dev/einsatztagebuch/Cargo.lock (0.2.126)
# entsprechen, sonst schlaegt der Schema-Vergleich von wasm-bindgen-cli fehl.
wasm-bindgen = "=0.2.126"

sha2 = { version = "=0.11.0", default-features = false }
hex = "=0.4.3"
