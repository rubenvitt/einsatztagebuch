[package]
name = "xtask"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false

[features]
# Das Saat-Ziel `seed-demo`. AUSDRUECKLICH nicht `default`: ein
# Vorgabebau von `xtask` loest `ea-demo-world` nicht auf, und der Zeuge
# `no_production_build_carries_the_ea_admin_test_surface` liest den
# Merkmalsgraphen jedes Produktionswirts — `xtask` eingeschlossen — mit
# VORGABEmerkmalen. Dieselbe Bauweise wie `desktop-fixture` in `apps/cli`.
seed-demo = ["dep:ea-demo-world", "ea-demo-world/fixture-world"]

[dependencies]
ea-demo-world = { workspace = true, optional = true }
cddl.workspace = true
cddl-cat.workspace = true
ea-cbor.workspace = true
ea-schema.workspace = true
jsonschema.workspace = true
serde_json.workspace = true
toml.workspace = true

[dev-dependencies]
# Der Grammatiktest stellt die ECHT KODIERTEN Kerne von
# `local-audit-event-core-v1` gegen die eingefrorene CDDL. Ein zweiter,
# handgeschriebener Kodierer waere eine zweite Quelle der Wahrheit und koennte
# von `ea_format::encode_local_audit_core` abweichen, ohne dass es auffaellt.
ea-format.workspace = true
minicbor.workspace = true
toml.workspace = true

[build-dependencies]
